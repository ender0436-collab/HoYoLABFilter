<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>HoYoLAB Filter</title>

<link
  rel="stylesheet"
  href="popup.css">

</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">

            <div class="logo__icon">
                ⛔
            </div>

>

                <div class="logo__title">
                    HoYoLAB Filter
                </div>

                <div class="logo__subtitle">
                    Quick Add
                </div>

            </div>

        </div>

    </header>

    <main>

        <!-- NGワード -->

        <section class="card">

            <div class="card__title">

                NGワード

            </div>

            <div class="input-row">

                <input
                    id="wordInput"
                    type="text"
                    placeholder="NGワードを追加">

                <button
                    id="addWord"
                    class="btn-primary">

                    追加

                </button>

            </div>

        </section>

        <!-- NGユーザー -->

        <section class="card">

            <div class="card__title">

                NGユーザーID

            </div>

            <div class="input-row">

                <input
                    id="userInput"
                    type="text"
                    placeholder="NGユーザーIDを追加">

                <button
                    id="addUser"
                    class="btn-primary">

                    追加

                </button>

            </div>

        </section>

        <!-- NGタグ -->

        <section class="card">

            <div class="card__title">

                NGタグ

            </div>

            <div class="input-row">

                <input
                    id="tagInput"
                    type="text"
                    placeholder="NGタグを追加">

                <button
                    id="addTag"
                    class="btn-primary">

                    追加

                </button>

            </div>

        </section>

    </main>

    <footer class="footer">

        <button
            id="openOptions"
            class="btn-settings">

            ⚙ 設定を開く

        </button>

    </footer>

</div>

    <script src="popup.js"></script>

</body>

</html>
